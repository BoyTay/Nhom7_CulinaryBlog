<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập và đăng ký</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:wght@600;700&display=swap">
<style>
body{margin:0;background:#F6F5F0;color:#1C2118;font-family:'Be Vietnam Pro',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;font:600 15px 'Be Vietnam Pro',sans-serif;border:0;cursor:pointer}
.inp{box-sizing:border-box;width:100%;min-height:48px;border-radius:12px;border:1px solid #B9B6A8;background:#fff;padding:0 14px;font:400 16px 'Be Vietnam Pro',sans-serif}
.inp:focus{outline:2px solid #2D5D43;outline-offset:1px}
</style>
</helmet>
<div style="min-height:860px;display:flex;flex-wrap:wrap">
  <section style="flex:1 1 480px;background:#2D5D43;color:#F6F5F0;padding:56px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:32px">
    <a href="Main.dc.html" style="font:700 22px 'Bricolage Grotesque',sans-serif">Culinary Blog</a>
    <div style="display:flex;flex-direction:column;gap:16px;max-width:460px">
      <h2 style="margin:0;font:700 44px/1.1 'Bricolage Grotesque',sans-serif">Vào bếp cùng cộng đồng.</h2>
      <p style="margin:0;line-height:1.6;color:#D3E3D9">Đăng nhập để tạo công thức, thêm ảnh và xuất bản món ăn của bạn.</p>
    </div>
    <span style="font-size:13px;color:#D3E3D9">Phiên đăng nhập 15 phút, tự làm mới khi bạn còn hoạt động.</span>
  </section>

  <section style="flex:1 1 480px;display:flex;align-items:center;justify-content:center;padding:40px 24px">
    <div style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:24px">
      <div role="tablist" aria-label="Chế độ" style="display:flex;background:#E9E7DD;border-radius:14px;padding:4px;gap:4px">
        <button role="tab" aria-selected="{{isLogin}}" onClick="{{toLogin}}" class="btn" style="{{tabLogin}}">Đăng nhập</button>
        <button role="tab" aria-selected="{{isRegister}}" onClick="{{toRegister}}" class="btn" style="{{tabReg}}">Đăng ký</button>
      </div>

      <h1 style="margin:0;font:700 32px 'Bricolage Grotesque',sans-serif">{{heading}}</h1>

      <form style="display:flex;flex-direction:column;gap:16px" onSubmit="{{submit}}">
        <sc-if value="{{isRegister}}" hint-placeholder-val="{{false}}">
          <div style="display:flex;flex-direction:column;gap:6px">
            <label for="dn" style="font-size:14px;font-weight:600">Tên hiển thị</label>
            <input id="dn" class="inp" placeholder="2–100 ký tự" autocomplete="name">
          </div>
        </sc-if>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="em" style="font-size:14px;font-weight:600">Email</label>
          <input id="em" class="inp" type="email" placeholder="ban@email.com" autocomplete="email">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="pw" style="font-size:14px;font-weight:600">Mật khẩu</label>
          <input id="pw" class="inp" type="password" autocomplete="current-password">
          <sc-if value="{{isRegister}}" hint-placeholder-val="{{false}}"><span style="font-size:13px;color:#5B6356">Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường và số.</span></sc-if>
        </div>

        <sc-if value="{{showError}}" hint-placeholder-val="{{false}}">
          <div role="alert" style="background:#FBE9E5;color:#8A2A16;border-radius:12px;padding:12px 14px;font-size:14px">{{errorText}}</div>
        </sc-if>

        <button type="submit" class="btn" style="background:#2D5D43;color:#fff;margin-top:4px">{{cta}}</button>
      </form>

      <div style="display:flex;align-items:center;gap:12px;color:#5B6356;font-size:13px"><span style="flex:1;height:1px;background:#D8D5C8"></span>hoặc<span style="flex:1;height:1px;background:#D8D5C8"></span></div>
      <button class="btn" style="background:#fff;border:1px solid #B9B6A8;color:#1C2118">Tiếp tục với Google</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
  state = { mode: 'login', err: false };
  renderVals() {
    const login = this.state.mode === 'login';
    const on = 'background:#fff;color:#1C2118;flex:1;box-shadow:0 1px 3px rgba(0,0,0,.12)';
    const off = 'background:transparent;color:#3C4437;flex:1';
    return {
      isLogin: login, isRegister: !login,
      tabLogin: login ? on : off, tabReg: login ? off : on,
      heading: login ? 'Chào mừng trở lại' : 'Tạo tài khoản',
      cta: login ? 'Đăng nhập' : 'Đăng ký',
      toLogin: () => this.setState({ mode: 'login', err: false }),
      toRegister: () => this.setState({ mode: 'register', err: false }),
      submit: (e) => { e.preventDefault(); this.setState({ err: true }); },
      showError: this.state.err,
      errorText: login ? 'Email hoặc mật khẩu không đúng.' : 'Email này đã được đăng ký.'
    };
  }
}
</script>
</body>
</html>
