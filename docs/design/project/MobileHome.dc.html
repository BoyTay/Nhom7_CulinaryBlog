<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trang chủ mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:wght@600;700&display=swap">
<style>
body{margin:0;background:#F6F5F0;color:#1C2118;font-family:'Be Vietnam Pro',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:1500px;box-sizing:border-box;background:#F6F5F0;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:60px;border-bottom:1px solid #E2E0D6">
    <a href="MobileHome.dc.html" style="font:700 20px 'Bricolage Grotesque',sans-serif;color:#2D5D43">Culinary Blog</a>
    <div style="display:flex;gap:4px">
      <button aria-label="Tìm kiếm" style="width:44px;height:44px;border:0;background:transparent"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2118" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button aria-label="Mở menu" aria-expanded="false" style="width:44px;height:44px;border:0;background:transparent"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2118" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>

  <section style="padding:28px 16px 24px;display:flex;flex-direction:column;gap:16px">
    <h1 style="margin:0;font:700 38px/1.08 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em">Món ngon từ bếp nhà, chia sẻ cho mọi người.</h1>
    <p style="margin:0;line-height:1.6;color:#5B6356">Tìm công thức theo nguyên liệu, không cần gõ dấu.</p>
    <a href="MobileHome.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;background:#2D5D43;color:#fff;font-weight:600">Khám phá công thức</a>
    <div style="height:200px;border-radius:20px;background:repeating-linear-gradient(135deg,#DCE8DF 0 14px,#E9F0EA 14px 28px)"></div>
  </section>

  <section style="padding:8px 16px 24px;display:flex;flex-direction:column;gap:14px">
    <h2 style="margin:0;font:700 24px 'Bricolage Grotesque',sans-serif">Danh mục</h2>
    <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <a href="MobileHome.dc.html" style="flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:#fff;border:1px solid #E2E0D6;font-weight:500;font-size:14px">{{c}}</a>
      </sc-for>
    </div>
  </section>

  <section style="padding:8px 16px 32px;display:flex;flex-direction:column;gap:16px">
    <h2 style="margin:0;font:700 24px 'Bricolage Grotesque',sans-serif">Công thức mới nhất</h2>
    <sc-for list="{{recipes}}" as="r" hint-placeholder-count="4">
      <a href="MobileDetail.dc.html" style="display:flex;gap:14px;background:#fff;border:1px solid #E2E0D6;border-radius:16px;padding:10px;min-height:96px;box-sizing:border-box">
        <div style="flex:none;width:96px;border-radius:10px;background:repeating-linear-gradient(135deg,#EDE6D8 0 10px,#F4EFE4 10px 20px)"></div>
        <div style="display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0">
          <span style="font-size:11px;font-weight:600;color:#2D5D43;letter-spacing:.04em;text-transform:uppercase">{{r.category}}</span>
          <strong style="font:700 17px/1.25 'Bricolage Grotesque',sans-serif">{{r.title}}</strong>
          <span style="font-size:13px;color:#5B6356">{{r.time}} · {{r.level}}</span>
        </div>
      </a>
    </sc-for>
    <a href="MobileHome.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;border:1px solid #B9B6A8;font-weight:600">Xem tất cả</a>
  </section>

  <section style="margin:0 16px 24px;background:#1C2118;color:#F6F5F0;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px">
    <h2 style="margin:0;font:700 24px/1.2 'Bricolage Grotesque',sans-serif">Có món tủ muốn chia sẻ?</h2>
    <a href="Login.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:#F6F5F0;color:#1C2118;font-weight:600">Tạo tài khoản</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cats: ['Món chính', 'Món nước', 'Món chay', 'Tráng miệng', 'Đồ uống'],
      recipes: [
        { title: 'Phở bò Hà Nội', category: 'Món nước', time: '90 phút', level: 'Trung bình' },
        { title: 'Bún chả nướng than', category: 'Món chính', time: '45 phút', level: 'Dễ' },
        { title: 'Cá kho tộ', category: 'Món mặn', time: '60 phút', level: 'Trung bình' },
        { title: 'Chè bưởi', category: 'Tráng miệng', time: '40 phút', level: 'Khó' }
      ]
    };
  }
}
</script>
</body>
</html>
