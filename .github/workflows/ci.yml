name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=culinary_blog;Username=culinary
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: culinary_blog
          POSTGRES_USER: culinary
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U culinary -d culinary_blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore CulinaryBlog.sln

      - name: Verify formatting
        run: dotnet format CulinaryBlog.sln --no-restore --verify-no-changes

      - name: Build
        run: dotnet build CulinaryBlog.sln --configuration Release --no-restore --warnaserror

      - name: Validate clean database and previous-schema upgrade
        run: |
          dotnet ef database update 20260930124003_AddPublishedAtToRecipe --project src/CulinaryBlog.Infrastructure/CulinaryBlog.Infrastructure.csproj --startup-project src/CulinaryBlog.API/CulinaryBlog.API.csproj --configuration Release --no-build
          dotnet ef database update --project src/CulinaryBlog.Infrastructure/CulinaryBlog.Infrastructure.csproj --startup-project src/CulinaryBlog.API/CulinaryBlog.API.csproj --configuration Release --no-build

      - name: Capture PostgreSQL FTS EXPLAIN ANALYZE evidence
        run: dotnet test tests/CulinaryBlog.Integration.Tests/CulinaryBlog.Integration.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~SearchGinIndexesAreInstalledAndPostgresProducesIndexedExplainPlans" --logger "console;verbosity=detailed"

      - name: Test
        run: dotnet test CulinaryBlog.sln --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Audit dependencies
        run: dotnet list CulinaryBlog.sln package --vulnerable --include-transitive

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/CulinaryBlog.Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/CulinaryBlog.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet
