events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Docker's embedded DNS. With `resolve`, nginx re-resolves the service names while running,
    # so a rebuilt api/web/minio container (new IP) is picked up without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream culinary_api {
        zone culinary_api 64k;
        server api:8080 resolve;
    }

    upstream culinary_web {
        zone culinary_web 64k;
        server web:3000 resolve;
    }

    upstream culinary_minio {
        zone culinary_minio 64k;
        server minio:9000 resolve;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 6m;

        location ~ ^/(api|health|scalar|openapi|hangfire) {
            proxy_pass http://culinary_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # sitemap.xml is written to the public bucket by the sitemap job (default bucket name).
        location = /sitemap.xml {
            proxy_pass http://culinary_minio/culinary-blog/sitemap.xml;
            proxy_set_header Host minio:9000;
            proxy_hide_header x-amz-request-id;
        }

        location / {
            proxy_pass http://culinary_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
