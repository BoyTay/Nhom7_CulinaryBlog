events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    upstream culinary_api {
        server api:8080;
    }

    upstream culinary_web {
        server web:3000;
    }

    upstream culinary_minio {
        server minio:9000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 6m;

        location ~ ^/(api|health|scalar|openapi|hangfire) {
            proxy_pass http://culinary_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # sitemap.xml is written to the public bucket by the sitemap job (default bucket name).
        location = /sitemap.xml {
            proxy_pass http://culinary_minio/culinary-blog/sitemap.xml;
            proxy_set_header Host minio:9000;
            proxy_hide_header x-amz-request-id;
        }

        location / {
            proxy_pass http://culinary_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
